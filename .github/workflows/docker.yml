name: Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

env:
  REGISTRY: nx.bcary.dev
  IMAGE: nx.bcary.dev/website

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test:coverage

      - name: Build
        run: yarn build

      - name: Audit dependencies
        continue-on-error: true
        run: yarn npm audit --all --recursive

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Test inside the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: test
          push: false
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}

  docker:
    runs-on: ubuntu-latest
    needs: [test, image]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ env.IMAGE }}:latest

      - name: Scan pushed image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          output: trivy.txt

      - name: Publish scan summary
        if: always()
        run: |
          {
            echo "### Trivy — ${IMAGE}:latest"
            echo '```'
            head -c 60000 trivy.txt 2>/dev/null || echo "scan produced no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
